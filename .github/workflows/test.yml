name: Test

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install backend deps
        working-directory: wedding-planner-backend
        run: uv sync --all-groups

      - name: Run backend tests
        working-directory: wedding-planner-backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: wedding-planner-frontend
        run: npm ci

      - name: Lint
        working-directory: wedding-planner-frontend
        run: npm run lint

      - name: Unit tests
        working-directory: wedding-planner-frontend
        run: npm run test:run

      - name: Build
        working-directory: wedding-planner-frontend
        run: npm run build
